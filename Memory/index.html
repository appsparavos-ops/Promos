<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Juego de Memoria - RUMI</title>
    <!-- Firebase SDK (Version 8 compat) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <link rel="icon" type="image/jpeg" href="img/favicon.jpg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --panel-bg: rgba(30, 41, 59, 0.7);
            --card-back: #1e293b;
            --card-border: #334155;
            --accent-color: #6366f1;
            --accent-hover: #4f46e5;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --active-player: #10b981;
        }

        ::-webkit-scrollbar {
            display: none;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            user-select: none;
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        body {
            background-color: #4a3728;
            background-image: url('img/fondo.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 1100px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* CONFIGURACIÓN INICIAL */
        .card-panel {
            background: var(--panel-bg);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 30px;
            width: 100%;
            max-width: 480px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
            text-align: center;
        }

        h1 {
            font-size: 2rem;
            font-weight: 800;
            margin-bottom: 20px;
            background: linear-gradient(135deg, #818cf8, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        label {
            display: block;
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-bottom: 8px;
            font-weight: 600;
        }

        select, input {
            width: 100%;
            padding: 12px 16px;
            border-radius: 10px;
            border: 1px solid var(--card-border);
            background-color: #0f172a;
            color: var(--text-main);
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        select:focus, input:focus {
            border-color: var(--accent-color);
        }

        .player-inputs {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 15px;
        }

        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background-color: var(--accent-color);
            color: white;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 14px 0 rgba(99, 102, 241, 0.39);
        }

        .btn:hover {
            background-color: var(--accent-hover);
            transform: translateY(-2px);
        }

        /* TABLERO Y PUNTUACIÓN */
        #game-screen {
            display: none;
            width: 100%;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .scoreboard {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
            width: 100%;
        }

        .player-card {
            background: var(--panel-bg);
            border: 2px solid var(--card-border);
            padding: 12px 20px;
            border-radius: 12px;
            min-width: 140px;
            text-align: center;
            transition: all 0.3s ease;
        }

        .player-card.active {
            border-color: var(--active-player);
            box-shadow: 0 0 15px rgba(16, 185, 129, 0.3);
            transform: scale(1.05);
        }

        .player-card .name {
            font-size: 0.85rem;
            color: var(--text-muted);
            font-weight: 600;
        }

        .player-card .score {
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--text-main);
        }

        .grid {
            display: grid;
            gap: 10px;
            width: fit-content;
            max-width: 100%;
            overflow-x: auto;
            perspective: 1000px;
        }

        .grid.cards-12 {
            grid-template-columns: repeat(4, 120px);
        }

        .grid.cards-24,
        .grid.cards-36 {
            grid-template-columns: repeat(6, 120px);
        }

        .grid.cards-48 {
            grid-template-columns: repeat(8, 120px);
        }

        /* CARTAS 3D */
        .card {
            width: 120px;
            aspect-ratio: 1 / 1;
            position: relative;
            cursor: pointer;
            transform-style: preserve-3d;
            transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .card.flipped {
            transform: rotateY(180deg);
        }

        .card.matched {
            visibility: hidden;
            opacity: 0;
            transition: opacity 0.5s ease, visibility 0.5s ease;
            pointer-events: none;
        }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid var(--card-border);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
        }

        .card-back-face {
            background-color: #1e293b;
            background-image: url('img/reves.jpg');
            background-size: cover;
            background-position: center;
        }

        .card-back-face::after {
            content: none;
        }

        .card-front-face {
            background-color: #ffffff;
            transform: rotateY(180deg);
            padding: 0;
            overflow: hidden;
        }

        .card-front-face img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 8px; /* Ajustado para que respete el borde de la carta */
        }

        /* MODAL DE VICTORIA */
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background-color: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(5px);
            align-items: center;
            justify-content: center;
            z-index: 100;
        }

        .modal-content {
            background: var(--panel-bg);
            border: 1px solid var(--card-border);
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            max-width: 400px;
            width: 90%;
        }

        .modal h2 {
            font-size: 2rem;
            margin-bottom: 10px;
            color: var(--active-player);
        }

        .modal p {
            margin-bottom: 20px;
            color: var(--text-muted);
        }

        /* TEMPORIZADOR */
        .timer-display {
            font-size: 2.5rem;
            font-weight: 900;
            color: var(--text-main);
            background: var(--panel-bg);
            border: 2px solid var(--card-border);
            border-radius: 12px;
            padding: 10px 30px;
            text-align: center;
            letter-spacing: 2px;
            min-width: 160px;
        }

        .timer-display.warning {
            color: #f59e0b;
            border-color: #f59e0b;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }

        /* TABLA DE RECORDS */
        .leaderboard {
            width: 100%;
            border-collapse: collapse;
            margin: 15px 0;
            font-size: 0.9rem;
        }

        .leaderboard th {
            color: var(--text-muted);
            padding: 6px 10px;
            text-align: left;
            border-bottom: 1px solid var(--card-border);
        }

        .leaderboard td {
            padding: 8px 10px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            color: var(--text-main);
        }

        .leaderboard tr:first-child td {
            color: #fbbf24;
            font-weight: 700;
        }

        .leaderboard tr.new-record td {
            color: #10b981;
            font-weight: 700;
        }

        .modal-content.wide {
            max-width: 500px;
        }

        /* ANIMACIÓN DE PUNTAJE */
        .floating-score {
            position: fixed;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            font-size: 3rem;
            font-weight: 900;
            color: #10b981;
            text-shadow: 0 0 15px rgba(0,0,0,0.8), 0 0 30px #10b981;
            z-index: 1000;
            pointer-events: none;
            opacity: 0;
        }

        /* CONTROLES DE AUDIO */
        .audio-controls {
            position: fixed;
            bottom: 20px;
            right: 20px;
            display: flex;
            align-items: center;
            gap: 15px;
            background: var(--panel-bg);
            border: 1px solid var(--card-border);
            border-radius: 30px;
            padding: 8px 15px 8px 20px;
            z-index: 100;
            backdrop-filter: blur(12px);
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        .mute-btn {
            background: transparent;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s;
        }

        .mute-btn:hover {
            transform: scale(1.1);
        }

        input[type="range"] {
            width: 80px;
            accent-color: var(--accent-color);
            cursor: pointer;
        }

        /* VOZ ONLINE */
        .voice-btn {
            background: rgba(255,255,255,0.1);
            border: 2px solid var(--card-border);
            border-radius: 50%;
            width: 44px;
            height: 44px;
            font-size: 1.3rem;
            cursor: pointer;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            flex-shrink: 0;
        }
        .voice-btn:hover { transform: scale(1.1); }
        .voice-btn.active {
            background: #16a34a;
            border-color: #22c55e;
            box-shadow: 0 0 12px rgba(34,197,94,0.5);
        }
        .voice-btn.muted {
            background: #dc2626;
            border-color: #ef4444;
        }
        .peer-indicator {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 0.75rem;
            background: rgba(255,255,255,0.07);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 3px 8px;
            color: var(--text-muted);
        }
        .peer-indicator .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #64748b;
            flex-shrink: 0;
        }
        .peer-indicator.connected .dot { background: #22c55e; }
        .peer-indicator.speaking .dot {
            background: #22c55e;
            animation: pulse 0.7s infinite;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- MENÚ PRINCIPAL -->
        <div id="main-menu-screen" class="card-panel">
            <h1>K-Pop Demon Hunters</h1>
            <p style="text-align:center; color:var(--text-muted); margin-bottom:20px;">Elige tu modo de juego</p>
            <button class="btn" style="margin-bottom: 15px;" onclick="showScreen('setup-screen')">Juego Local</button>
            <button class="btn" onclick="showScreen('online-menu-screen')">Juego Online</button>
        </div>

        <!-- PANTALLA CONFIGURACIÓN (LOCAL) -->
        <div id="setup-screen" class="card-panel" style="display: none;">
            <h1>Juego Local</h1>
            <div class="form-group">
                <label for="player-count">Cantidad de Jugadores</label>
                <select id="player-count" onchange="renderPlayerInputs(); savePreferences()">
                    <option value="1">1 Jugador (Contra el Tiempo)</option>
                    <option value="2" selected>2 Jugadores</option>
                    <option value="3">3 Jugadores</option>
                    <option value="4">4 Jugadores</option>
                </select>
            </div>

            <div class="form-group">
                <label for="card-count">Nivel de Dificultad</label>
                <select id="card-count" onchange="savePreferences()">
                    <option value="12" selected>Principiante</option>
                    <option value="24">Intermedio</option>
                    <option value="36">Avanzado</option>
                    <option value="48">Profesional</option>
                </select>
            </div>

            <div class="form-group" id="game-mode-group">
                <label for="game-mode">Modo de Juego</label>
                <select id="game-mode" onchange="savePreferences()">
                    <option value="prob" selected>Dinámico</option>
                    <option value="classic">Clásico</option>
                </select>
            </div>

            <div id="player-inputs" class="player-inputs"></div>

            <button class="btn" style="margin-top: 20px;" onclick="startGame()">Iniciar Juego</button>
            <button class="btn" style="margin-top: 10px; background: #64748b;" onclick="showScreen('main-menu-screen')">Volver</button>
        </div>

        <!-- PANTALLA MENÚ ONLINE -->
        <div id="online-menu-screen" class="card-panel" style="display: none;">
            <h1>Juego Online</h1>
            <div class="form-group">
                <label for="online-player-name">Tu Nombre</label>
                <input type="text" id="online-player-name" placeholder="Ej: Arturo" oninput="localStorage.setItem('onlinePlayerName', this.value)">
            </div>
            
            <div style="display:flex; gap:10px; margin-top:20px;">
                <button class="btn" style="flex:1;" onclick="createOnlineRoom()">Crear Sala</button>
            </div>
            
            <div style="margin: 20px 0; text-align:center; color:var(--text-muted);">--- o ---</div>
            
            <div class="form-group">
                <label for="room-code-input">Código de Sala</label>
                <input type="text" id="room-code-input" placeholder="Ej: X9K2" style="text-transform: uppercase;">
            </div>
            <button class="btn" onclick="joinOnlineRoom()">Unirse a Sala</button>
            
            <button class="btn" style="margin-top: 15px; background: #64748b;" onclick="showScreen('main-menu-screen')">Volver</button>
        </div>

        <!-- PANTALLA LOBBY (SALA DE ESPERA ONLINE) -->
        <div id="online-lobby-screen" class="card-panel" style="display: none;">
            <h1>Sala: <span id="lobby-room-code" style="color:var(--accent-color);"></span></h1>
            <p style="text-align:center; color:var(--text-muted); margin-bottom:10px;">Jugadores en la sala:</p>
            <div id="lobby-players-list" style="margin-bottom: 20px; font-size:1.2rem; text-align:center; color:white;">
                <!-- Lista de jugadores generada dinámicamente -->
            </div>
            
            <!-- Controles que solo verá el creador -->
            <div id="lobby-host-controls" style="display:none; border-top:1px solid var(--card-border); padding-top:15px;">
                <div class="form-group">
                    <label for="online-card-count">Dificultad (para todos)</label>
                    <select id="online-card-count">
                        <option value="12" selected>Principiante</option>
                        <option value="24">Intermedio</option>
                        <option value="36">Avanzado</option>
                        <option value="48">Profesional</option>
                    </select>
                </div>
                <button class="btn" onclick="startOnlineGame()">Comenzar Partida</button>
            </div>
            
            <p id="lobby-waiting-msg" style="text-align:center; color:var(--text-muted); display:none;">Esperando a que el anfitrión inicie...</p>
            
            <button class="btn" style="margin-top: 15px; background: #ef4444;" onclick="leaveOnlineRoom()">Salir de la Sala</button>
        </div>

        <!-- PANTALLA DE JUEGO -->
        <div id="game-screen">
            <div id="scoreboard" class="scoreboard"></div>
            <div id="timer-container" style="display:none;">
                <div id="timer-display" class="timer-display">00:00</div>
            </div>
            <!-- Barra de estado de voz (solo visible en modo online) -->
            <div id="voice-bar" style="display:none; align-items:center; gap:10px; flex-wrap:wrap; justify-content:center; margin-bottom:8px;">
                <button id="voice-btn" class="voice-btn" onclick="toggleVoiceChat()" title="Activar micrófono">🎙️</button>
                <div id="voice-status" style="font-size:0.8rem; color:var(--text-muted);">Voz desactivada</div>
                <div id="peers-status" style="display:flex; gap:8px; flex-wrap:wrap;"></div>
            </div>
            <div id="grid" class="grid"></div>
        </div>
    </div>

    <!-- MODAL FIN DE JUEGO MULTIJUGADOR -->
    <div id="winner-modal" class="modal">
        <div class="modal-content">
            <h2 id="winner-title">¡Fin del Juego!</h2>
            <p id="winner-detail"></p>
            <button class="btn" onclick="resetToSetup()">Jugar de Nuevo</button>
        </div>
    </div>

    <!-- MODAL DE RECORDS (1 JUGADOR) -->
    <div id="records-modal" class="modal">
        <div class="modal-content wide">
            <h2 id="records-title" style="color: #fbbf24;">⏱️ ¡Tiempo!</h2>
            <p id="records-detail" style="margin-bottom:10px;"></p>
            <table class="leaderboard" id="leaderboard-table">
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Nombre</th>
                        <th>Nivel</th>
                        <th>Tiempo</th>
                    </tr>
                </thead>
                <tbody id="leaderboard-body"></tbody>
            </table>
            <button class="btn" style="margin-top:10px;" onclick="resetToSetup()">Jugar de Nuevo</button>
        </div>
    </div>

    <!-- AUDIO Y BOTÓN MUTE -->
    <audio id="bg-music" src="audio.mp3" loop></audio>
    <div id="audio-controls" class="audio-controls" style="display: none;">
        <input type="range" id="volume-slider" min="0" max="1" step="0.05" value="1" oninput="changeVolume()">
        <button id="mute-btn" class="mute-btn" onclick="toggleMute()">🔊</button>
    </div>

    <script>
        // CONFIGURACIÓN: Las imágenes de las guerreras estarán en la carpeta 'img' y se llamarán 1.jpg, 2.jpg... hasta 24.jpg
        let players = [];
        let currentPlayerIndex = 0;
        let cardsData = [];
        let flippedCards = [];
        let lockBoard = false;
        let matchedPairsCount = 0;
        let seenCards = new Set();
        let isMuted = false;
        let currentMode = 'prob';
        let totalPairsTarget = 0;
        let hasReshuffled = false;
        let globalVolume = 1;
        // Variables del modo 1 jugador
        let isSoloMode = false;
        let timerInterval = null;
        let elapsedSeconds = 0;
        const LEVEL_NAMES = { '12': 'Principiante', '24': 'Intermedio', '36': 'Avanzado', '48': 'Profesional' };

        // Variables Modo Online
        let isOnlineMode = false;
        let isHost = false;
        let roomCode = null;
        let myPlayerId = null;
        let db = null; // Referencia a Firebase Database
        let roomRef = null;

        // Configuración de Firebase (Debes reemplazar esto con tus credenciales de Firebase)
        const firebaseConfig = {
          apiKey: "AIzaSyBN17FWBFoiEQ9TDj6JVqlPob1bdKPu-7I",
          authDomain: "memorykpop-b5858.firebaseapp.com",
          databaseURL: "https://memorykpop-b5858-default-rtdb.firebaseio.com",
          projectId: "memorykpop-b5858",
          storageBucket: "memorykpop-b5858.firebasestorage.app",
          messagingSenderId: "299504318718",
          appId: "1:299504318718:web:ce0486f47afab0f1820daf",
          measurementId: "G-BJZ2ETV1MW"
        };
        // Inicializar Firebase solo si se han configurado las credenciales
        if (firebaseConfig.apiKey) {
            firebase.initializeApp(firebaseConfig);
            db = firebase.database();
        }

        function showScreen(screenId) {
            document.getElementById('main-menu-screen').style.display = 'none';
            document.getElementById('setup-screen').style.display = 'none';
            document.getElementById('online-menu-screen').style.display = 'none';
            document.getElementById('online-lobby-screen').style.display = 'none';
            document.getElementById('game-screen').style.display = 'none';
            document.getElementById('winner-modal').style.display = 'none';
            document.getElementById('records-modal').style.display = 'none';
            
            if (screenId === 'game-screen') {
                document.getElementById('game-screen').style.display = 'flex';
            } else {
                document.getElementById(screenId).style.display = 'block';
            }
        }

        function generateId() {
            return Math.random().toString(36).substr(2, 9);
        }

        function generateRoomCode() {
            // Sin caracteres ambiguos: sin O/0, I/1, l, S/5, Z/2
            const chars = 'ABCDEFGHJKMNPQRTUVWXY3467';
            let code = '';
            for (let i = 0; i < 4; i++) {
                code += chars[Math.floor(Math.random() * chars.length)];
            }
            return code;
        }
        
        function getMyName() {
            return document.getElementById('online-player-name').value.trim() || 'Anónimo';
        }

        // =============================================
        // CHAT DE VOZ (WebRTC)
        // =============================================
        let localStream = null;
        let micMuted = false;
        let voiceEnabled = false;
        let peerConnections = {}; // { peerId: RTCPeerConnection }
        let audioElements = {};   // { peerId: HTMLAudioElement }
        let myOrder = 0;

        const STUN_SERVERS = {
            iceServers: [
                { urls: 'stun:stun.l.google.com:19302' },
                { urls: 'stun:stun1.l.google.com:19302' },
                { urls: 'stun:stun2.l.google.com:19302' }
            ]
        };

        async function toggleVoiceChat() {
            if (!voiceEnabled) {
                await startVoiceChat();
            } else {
                // Si ya está activo: toggle mute
                micMuted = !micMuted;
                if (localStream) {
                    localStream.getAudioTracks().forEach(t => t.enabled = !micMuted);
                }
                const btn = document.getElementById('voice-btn');
                btn.textContent = micMuted ? '🔇' : '🎤';
                btn.classList.toggle('muted', micMuted);
                document.getElementById('voice-status').textContent = micMuted ? 'Micrófono silenciado' : 'Voz activa';
            }
        }

        async function startVoiceChat() {
            try {
                localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
                voiceEnabled = true;
                micMuted = false;

                const btn = document.getElementById('voice-btn');
                btn.textContent = '🎤';
                btn.classList.add('active');
                btn.title = 'Toca para silenciar';
                document.getElementById('voice-status').textContent = 'Voz activa — toca para silenciar';

                // Iniciar conexión con cada jugador
                for (const player of players) {
                    if (player.id !== myPlayerId) {
                        setupPeerConnection(player.id, player.name, player.order);
                    }
                }

                // Escuchar señalización de otros jugadores que activen voz después
                roomRef.child('signaling').on('child_added', snap => {
                    const fromId = snap.key;
                    if (fromId !== myPlayerId && !peerConnections[fromId]) {
                        const player = players.find(p => p.id === fromId);
                        if (player) setupPeerConnection(fromId, player.name, player.order);
                    }
                });

                // Anunciar en Firebase que estoy disponible para voz
                roomRef.child(`signaling/${myPlayerId}/meta`).set({ name: getMyName(), ts: firebase.database.ServerValue.TIMESTAMP });

            } catch (err) {
                alert('No se pudo acceder al micrófono. Verifica los permisos.\n' + err.message);
            }
        }

        async function setupPeerConnection(peerId, peerName, peerOrder) {
            if (peerConnections[peerId]) return; // Ya existe

            const pc = new RTCPeerConnection(STUN_SERVERS);
            peerConnections[peerId] = pc;

            // Agregar tracks locales
            if (localStream) {
                localStream.getTracks().forEach(t => pc.addTrack(t, localStream));
            }

            // Indicador visual del peer
            updatePeerIndicator(peerId, peerName, 'connecting');

            // Stream remoto recibido → reproducirlo
            pc.ontrack = (event) => {
                updatePeerIndicator(peerId, peerName, 'connected');
                let audio = audioElements[peerId];
                if (!audio) {
                    audio = document.createElement('audio');
                    audio.autoplay = true;
                    audio.id = 'voice-audio-' + peerId;
                    document.body.appendChild(audio);
                    audioElements[peerId] = audio;

                    // Detectar actividad de voz (VAD básico)
                    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                    const source = audioCtx.createMediaStreamSource(event.streams[0]);
                    const analyser = audioCtx.createAnalyser();
                    analyser.fftSize = 512;
                    source.connect(analyser);
                    const data = new Uint8Array(analyser.fftSize);
                    setInterval(() => {
                        analyser.getByteTimeDomainData(data);
                        const speaking = data.some(v => Math.abs(v - 128) > 20);
                        updatePeerIndicator(peerId, peerName, speaking ? 'speaking' : 'connected');
                    }, 200);
                }
                audio.srcObject = event.streams[0];
            };

            // ICE candidates → subir a Firebase
            pc.onicecandidate = (event) => {
                if (event.candidate) {
                    roomRef.child(`signaling/${myPlayerId}/to/${peerId}/candidates`).push(event.candidate.toJSON());
                }
            };

            pc.onconnectionstatechange = () => {
                if (pc.connectionState === 'disconnected' || pc.connectionState === 'failed') {
                    updatePeerIndicator(peerId, peerName, 'disconnected');
                }
            };

            // Escuchar ICE candidates remotos
            roomRef.child(`signaling/${peerId}/to/${myPlayerId}/candidates`).on('child_added', async snap => {
                const cand = snap.val();
                if (cand && pc.remoteDescription) {
                    try { await pc.addIceCandidate(new RTCIceCandidate(cand)); } catch (e) {}
                }
            });

            // El jugador con menor order crea la oferta (evita colisión)
            if (myOrder <= peerOrder) {
                // Yo envío la oferta
                const offer = await pc.createOffer();
                await pc.setLocalDescription(offer);
                roomRef.child(`signaling/${myPlayerId}/to/${peerId}/offer`).set({ type: offer.type, sdp: offer.sdp });

                // Esperar respuesta
                roomRef.child(`signaling/${peerId}/to/${myPlayerId}/answer`).on('value', async snap => {
                    const answer = snap.val();
                    if (answer && !pc.currentRemoteDescription) {
                        await pc.setRemoteDescription(new RTCSessionDescription(answer));
                    }
                });
            } else {
                // Espero la oferta del otro
                roomRef.child(`signaling/${peerId}/to/${myPlayerId}/offer`).on('value', async snap => {
                    const offer = snap.val();
                    if (offer && !pc.currentRemoteDescription) {
                        await pc.setRemoteDescription(new RTCSessionDescription(offer));
                        const answer = await pc.createAnswer();
                        await pc.setLocalDescription(answer);
                        roomRef.child(`signaling/${myPlayerId}/to/${peerId}/answer`).set({ type: answer.type, sdp: answer.sdp });
                    }
                });
            }
        }

        function updatePeerIndicator(peerId, name, state) {
            const container = document.getElementById('peers-status');
            let indicator = document.getElementById('peer-ind-' + peerId);
            if (!indicator) {
                indicator = document.createElement('div');
                indicator.id = 'peer-ind-' + peerId;
                indicator.className = 'peer-indicator';
                indicator.innerHTML = `<span class="dot"></span><span>${name}</span>`;
                container.appendChild(indicator);
            }
            indicator.className = 'peer-indicator ' + (state === 'disconnected' ? '' : state);
        }

        let lobbyListeners = []; // Para limpiar listeners de Firebase

        function clearLobbyListeners() {
            if (roomRef) {
                lobbyListeners.forEach(listener => roomRef.child(listener.path).off(listener.event, listener.cb));
            }
            lobbyListeners = [];

        function createOnlineRoom() {
            if (!db) return alert("Firebase no está configurado.");
            isOnlineMode = true;
            isHost = true;
            myPlayerId = generateId();
            roomCode = generateRoomCode();
            
            roomRef = db.ref('rooms/' + roomCode);
            roomRef.set({
                status: 'waiting',
                host: myPlayerId,
                players: {
                    [myPlayerId]: { name: getMyName(), order: 0 }
                }
            });

            // Borrar sala si el host se desconecta repentinamente
            roomRef.onDisconnect().remove();

            setupLobbyListeners();
            showScreen('online-lobby-screen');
        }

        function joinOnlineRoom() {
            if (!db) return alert("Firebase no está configurado.");
            isOnlineMode = true;
            isHost = false;
            
            const codeInput = document.getElementById('room-code-input').value.trim().toUpperCase();
            if (!codeInput) return alert("Ingresa un código.");
            
            const tempRef = db.ref('rooms/' + codeInput);
            tempRef.once('value', snapshot => {
                const room = snapshot.val();
                if (!room) return alert("La sala no existe.");
                if (room.status !== 'waiting') return alert("La partida ya comenzó o terminó.");
                
                roomCode = codeInput;
                roomRef = tempRef;
                myPlayerId = generateId();
                
                const currentPlayersCount = room.players ? Object.keys(room.players).length : 0;
                
                roomRef.child('players/' + myPlayerId).set({
                    name: getMyName(),
                    order: currentPlayersCount
                });
                
                // Borrar solo a este jugador si se desconecta
                roomRef.child('players/' + myPlayerId).onDisconnect().remove();
                
                setupLobbyListeners();
                showScreen('online-lobby-screen');
            });
        }

        function setupLobbyListeners() {
            document.getElementById('lobby-room-code').textContent = roomCode;
            document.getElementById('lobby-host-controls').style.display = isHost ? 'block' : 'none';
            document.getElementById('lobby-waiting-msg').style.display = isHost ? 'none' : 'block';

            // Escuchar jugadores conectados
            const playersCb = roomRef.child('players').on('value', snap => {
                const playersObj = snap.val() || {};
                const listEl = document.getElementById('lobby-players-list');
                listEl.innerHTML = '';
                
                // Convertir a array y ordenar por su orden de llegada
                const playersArr = Object.keys(playersObj).map(id => ({
                    id, 
                    ...playersObj[id]
                })).sort((a,b) => a.order - b.order);
                
                playersArr.forEach((p, i) => {
                    listEl.innerHTML += `<div>Jugador ${i+1}: ${p.name} ${p.id === myPlayerId ? '(Tú)' : ''}</div>`;
                });
            });
            lobbyListeners.push({ path: 'players', event: 'value', cb: playersCb });

            // Escuchar cuando el host inicie el juego
            const statusCb = roomRef.child('status').on('value', snap => {
                if (snap.val() === 'playing') {
                    startOnlineGameClient();
                } else if (snap.val() === null) {
                    alert("La sala se ha cerrado.");
                    leaveOnlineRoom(true);
                }
            });
            lobbyListeners.push({ path: 'status', event: 'value', cb: statusCb });
        }

        function leaveOnlineRoom(forced = false) {
            if (!forced && roomRef && myPlayerId) {
                if (isHost) {
                    roomRef.remove(); // Cierra la sala completa
                } else {
                    roomRef.child('players/' + myPlayerId).remove();
                    roomRef.child('players/' + myPlayerId).onDisconnect().cancel();
                }
            }
            clearLobbyListeners();
            isOnlineMode = false;
            roomRef = null;
            roomCode = null;
            showScreen('online-menu-screen');
        }

        function startOnlineGame() {
            // Validar cuántos jugadores hay antes de empezar
            roomRef.child('players').once('value', snap => {
                const playersObj = snap.val() || {};
                const numPlayers = Object.keys(playersObj).length;
                
                if (numPlayers < 2) {
                    if (!confirm("Estás solo en la sala. ¿Seguro que quieres empezar la partida sin esperar a otros jugadores?")) {
                        return; // Cancelar inicio
                    }
                }

                // Solo lo llama el Host desde el botón "Comenzar Partida"
                const cardCount = parseInt(document.getElementById('online-card-count').value);
                const deck = generateDeck(cardCount);
                
                // Subir el mazo y cambiar status para que todos inicien
                roomRef.update({
                    deck: deck,
                    status: 'playing',
                    totalPairsTarget: cardCount / 2
                });
            });
        }

        function startOnlineGameClient() {
            // Se ejecuta en todos los clientes cuando status cambia a 'playing'
            clearLobbyListeners();
            
            roomRef.once('value', snapshot => {
                const roomData = snapshot.val();
                
                // Cargar jugadores (preservando order para WebRTC)
                const playersArr = Object.keys(roomData.players).map(id => ({
                    id, 
                    ...roomData.players[id]
                })).sort((a,b) => a.order - b.order);

                players = playersArr.map(p => ({
                    id: p.id,
                    name: p.name,
                    score: 0,
                    order: p.order
                }));

                // Guardar mi order para la lógica WebRTC
                const myPlayerData = playersArr.find(p => p.id === myPlayerId);
                myOrder = myPlayerData ? myPlayerData.order : 0;
                
                // Cargar Mazo
                cardsData = roomData.deck || [];
                totalPairsTarget = roomData.totalPairsTarget;
                
                // Configurar Juego
                isSoloMode = false;
                currentPlayerIndex = 0;
                matchedPairsCount = 0;
                seenCards.clear();
                currentMode = 'prob';
                hasReshuffled = false;
                
                // Escuchar los clics del servidor
                setupGameListeners();

                // Mostrar pantalla de juego
                document.getElementById('online-lobby-screen').style.display = 'none';
                document.getElementById('game-screen').style.display = 'flex';
                document.getElementById('scoreboard').style.display = 'flex';
                document.getElementById('timer-container').style.display = 'none';
                // Mostrar barra de voz en modo online
                document.getElementById('voice-bar').style.display = 'flex';

                // Iniciar música
                const bgMusic = document.getElementById('bg-music');
                const audioControls = document.getElementById('audio-controls');
                bgMusic.play().catch(e => console.log('Autoplay bloqueado', e));
                audioControls.style.display = 'flex';
                
                renderScoreboard();
                renderBoard();
            });
        }

        function setupGameListeners() {
            // Escuchar nuevas jugadas
            roomRef.child('clicks').on('child_added', snapshot => {
                const clickData = snapshot.val();
                processCardClick(clickData.index);
            });
            
            // Escuchar reshuffle
            roomRef.child('reshuffled').on('value', snapshot => {
                if (snapshot.val() && !hasReshuffled) {
                    hasReshuffled = true;
                    // El host ya subió el nuevo mazo a 'deck'
                    roomRef.child('deck').once('value', deckSnap => {
                        cardsData = deckSnap.val();
                        seenCards.clear();
                        renderBoard();
                    });
                }
            });

            // Si el host vuelve al lobby
            roomRef.child('status').on('value', snapshot => {
                if (snapshot.val() === 'waiting' && document.getElementById('game-screen').style.display !== 'none') {
                    // Limpiar listeners del juego
                    roomRef.child('clicks').off();
                    roomRef.child('reshuffled').off();
                    roomRef.child('status').off();
                    
                    // Volver al lobby
                    if (timerInterval) stopTimer();
                    document.getElementById('winner-modal').style.display = 'none';
                    document.getElementById('records-modal').style.display = 'none';
                    document.getElementById('game-screen').style.display = 'none';
                    document.getElementById('online-lobby-screen').style.display = 'block';
                    setupLobbyListeners();
                }
            });
        }

        function formatTime(seconds) {
            const m = String(Math.floor(seconds / 60)).padStart(2, '0');
            const s = String(seconds % 60).padStart(2, '0');
            return `${m}:${s}`;
        }

        function startTimer() {
            elapsedSeconds = 0;
            const display = document.getElementById('timer-display');
            display.textContent = '00:00';
            display.classList.remove('warning');
            timerInterval = setInterval(() => {
                elapsedSeconds++;
                display.textContent = formatTime(elapsedSeconds);
                if (elapsedSeconds >= 120) display.classList.add('warning'); // parpadea si supera 2 min
            }, 1000);
        }

        function stopTimer() {
            clearInterval(timerInterval);
            timerInterval = null;
        }

        function getLeaderboard() {
            return JSON.parse(localStorage.getItem('leaderboard') || '[]');
        }

        function saveLeaderboard(lb) {
            localStorage.setItem('leaderboard', JSON.stringify(lb));
        }

        function addToLeaderboard(name, levelKey, seconds) {
            const lb = getLeaderboard();
            const entry = { name, level: LEVEL_NAMES[levelKey] || levelKey, seconds };
            lb.push(entry);
            lb.sort((a, b) => a.seconds - b.seconds);
            const top10 = lb.slice(0, 10);
            saveLeaderboard(top10);
            return top10.findIndex(e => e.name === entry.name && e.seconds === entry.seconds);
        }

        function showRecordsModal(playerName, levelKey, newSeconds) {
            stopTimer();
            const newRankIndex = addToLeaderboard(playerName, levelKey, newSeconds);
            const lb = getLeaderboard();

            document.getElementById('records-title').textContent = '⏱️ ¡Juego Completado!';
            document.getElementById('records-detail').textContent =
                `${playerName} terminó en ${formatTime(newSeconds)}`;

            const tbody = document.getElementById('leaderboard-body');
            tbody.innerHTML = '';
            if (lb.length === 0) {
                tbody.innerHTML = '<tr><td colspan="4" style="text-align:center;color:var(--text-muted)">Sin records aún</td></tr>';
            } else {
                lb.forEach((entry, i) => {
                    const tr = document.createElement('tr');
                    if (i === newRankIndex) tr.classList.add('new-record');
                    tr.innerHTML = `<td>${i + 1}</td><td>${entry.name}</td><td>${entry.level}</td><td>${formatTime(entry.seconds)}</td>`;
                    tbody.appendChild(tr);
                });
            }

            document.getElementById('records-modal').style.display = 'flex';
        }

        function animateScore(points, playerIndex) {
            if (isSoloMode) return; // No mostramos puntos en modo solitario (contra reloj)
            
            const floater = document.createElement('div');
            floater.className = 'floating-score';
            floater.style.textAlign = 'center';
            
            const playerName = players[playerIndex].name;
            floater.innerHTML = `<span style="font-size: 1.5rem; display: block; margin-bottom: 5px;">¡Felicitaciones ${playerName}!</span>Ganaste ${points} puntos`;
            
            // Si es puntaje doble, cambiar el color a dorado
            if (points >= 10) {
                floater.style.color = '#fbbf24';
                floater.style.textShadow = '0 0 15px rgba(0,0,0,0.8), 0 0 30px #fbbf24';
            }

            document.body.appendChild(floater);

            const targetCard = document.getElementById(`score-card-${playerIndex}`);
            let endX = 0;
            let endY = 0;

            if (targetCard) {
                const targetRect = targetCard.getBoundingClientRect();
                endX = (targetRect.left + targetRect.width / 2) - (window.innerWidth / 2);
                endY = (targetRect.top + targetRect.height / 2) - (window.innerHeight / 2);
            }

            const animation = floater.animate([
                { opacity: 0, transform: 'translate(-50%, -50%) scale(0.5)', offset: 0 },
                { opacity: 1, transform: 'translate(-50%, -50%) scale(1.2)', offset: 0.1 },
                { opacity: 1, transform: 'translate(-50%, -50%) scale(1)', offset: 0.15 },
                { opacity: 1, transform: 'translate(-50%, -50%) scale(1)', offset: 0.66 }, // Se queda en el centro hasta los 2s
                { opacity: 0, transform: `translate(calc(-50% + ${endX}px), calc(-50% + ${endY}px)) scale(0.2)`, offset: 1 } // Viaja lentamente en el último segundo
            ], {
                duration: 3000,
                easing: 'ease-in-out',
                fill: 'forwards'
            });

            animation.onfinish = () => floater.remove();
        }

        // Crear el mazo completo de parejas de imágenes
        function generateDeck(cardCount) {
            const deck = [];
            let id = 0;
            const pairCount = cardCount / 2;

            for (let i = 1; i <= pairCount; i++) {
                const cardSymbol = {
                    pairId: `kpop-${i}`,
                    image: `<img src="img/${i}.jpg" alt="Guerrera K-pop ${i}">`
                };
                // Se insertan 2 copias idénticas por pareja
                deck.push({ ...cardSymbol, instanceId: id++ });
                deck.push({ ...cardSymbol, instanceId: id++ });
            }

            // Algoritmo de mezcla Fisher-Yates
            for (let i = deck.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [deck[i], deck[j]] = [deck[j], deck[i]];
            }

            return deck;
        }

        function reshuffleBoard() {
            // Animación de aviso
            const floater = document.createElement('div');
            floater.className = 'floating-score';
            floater.style.textAlign = 'center';
            floater.style.color = '#c084fc';
            floater.style.textShadow = '0 0 15px rgba(0,0,0,0.8), 0 0 30px #c084fc';
            floater.innerHTML = `<span style="font-size: 2rem; display: block;">¡Magia Espiritual!</span>Modo 24 Cartas`;
            document.body.appendChild(floater);
            
            floater.animate([
                { opacity: 0, transform: 'translate(-50%, -50%) scale(0.5)' },
                { opacity: 1, transform: 'translate(-50%, -50%) scale(1.2)', offset: 0.2 },
                { opacity: 1, transform: 'translate(-50%, -50%) scale(1)', offset: 0.8 },
                { opacity: 0, transform: 'translate(-50%, -50%) scale(0.5)', offset: 1 }
            ], { duration: 2000, easing: 'ease-in-out' }).onfinish = () => floater.remove();

            if (isOnlineMode) {
                if (isHost) {
                    setTimeout(() => {
                        const matchedElements = document.querySelectorAll('.card.matched');
                        const matchedPairIds = Array.from(matchedElements).map(el => el.dataset.pairId);
                        let remainingCards = cardsData.filter(card => !matchedPairIds.includes(card.pairId));

                        for (let i = remainingCards.length - 1; i > 0; i--) {
                            const j = Math.floor(Math.random() * (i + 1));
                            [remainingCards[i], remainingCards[j]] = [remainingCards[j], remainingCards[i]];
                        }

                        // Subir a firebase para que los clientes (y este host) lo rendericen a través del listener
                        roomRef.update({
                            deck: remainingCards,
                            reshuffled: true
                        });
                    }, 1000);
                }
            } else {
                // Retrasar el renderizado real para que la animación se vea
                setTimeout(() => {
                    const matchedElements = document.querySelectorAll('.card.matched');
                    const matchedPairIds = Array.from(matchedElements).map(el => el.dataset.pairId);
                    let remainingCards = cardsData.filter(card => !matchedPairIds.includes(card.pairId));

                    for (let i = remainingCards.length - 1; i > 0; i--) {
                        const j = Math.floor(Math.random() * (i + 1));
                        [remainingCards[i], remainingCards[j]] = [remainingCards[j], remainingCards[i]];
                    }

                    cardsData = remainingCards;
                    seenCards.clear();
                    renderBoard();
                }, 1000);
            }
        }

        function startGame() {

            const cardCount = parseInt(document.getElementById('card-count').value);
            players = [];

        function renderScoreboard() {
            const container = document.getElementById('scoreboard');
            container.innerHTML = '';

            players.forEach((player, index) => {
                const div = document.createElement('div');
                div.className = `player-card ${index === currentPlayerIndex ? 'active' : ''}`;
                div.id = `score-card-${index}`;
                div.innerHTML = `
                    <div class="name">${player.name}</div>
                    <div class="score">${player.score}</div>
                `;
                container.appendChild(div);
            });
        }

        function updateScoreboard() {
            if (isSoloMode) return;
            players.forEach((player, index) => {
                const card = document.getElementById(`score-card-${index}`);
                if (card) {
                    card.querySelector('.score').textContent = player.score;
                    if (index === currentPlayerIndex) {
                        card.classList.add('active');
                    } else {
                        card.classList.remove('active');
                    }
                }
            });
        }

        function renderBoard() {
            const grid = document.getElementById('grid');
            grid.innerHTML = '';
            grid.className = `grid cards-${cardsData.length}`;

            cardsData.forEach((card, index) => {
                const cardEl = document.createElement('div');
                cardEl.className = 'card';
                cardEl.dataset.index = index;
                cardEl.dataset.pairId = card.pairId;

                cardEl.innerHTML = `
                    <div class="card-face card-back-face"></div>
                    <div class="card-face card-front-face">${card.image}</div>
                `;

                cardEl.addEventListener('click', () => handleCardClick(cardEl, index));
                grid.appendChild(cardEl);
            });
        }

        function handleCardClick(cardEl, index) {
            if (lockBoard) return;
            if (cardEl.classList.contains('flipped') || cardEl.classList.contains('matched')) return;

            if (isOnlineMode) {
                // Solo si es mi turno envío la jugada
                if (players[currentPlayerIndex].id === myPlayerId) {
                    roomRef.child('clicks').push({
                        index: index,
                        timestamp: firebase.database.ServerValue.TIMESTAMP
                    });
                }
            } else {
                processCardClick(index);
            }
        }

        function processCardClick(index) {
            const cardEl = document.querySelector(`.card[data-index='${index}']`);
            if (!cardEl) return;
            if (cardEl.classList.contains('flipped') || cardEl.classList.contains('matched')) return;

            cardEl.classList.add('flipped');
            flippedCards.push({ element: cardEl, index: index, pairId: cardsData[index].pairId });

            if (flippedCards.length === 2) {
                checkMatch();
            }
        }

        function checkMatch() {
            lockBoard = true;
            const [card1, card2] = flippedCards;

            const idx1 = card1.index;
            const idx2 = card2.index;
            const isCard1Seen = seenCards.has(idx1);
            const isCard2Seen = seenCards.has(idx2);

            if (card1.pairId === card2.pairId) {
                let points = 0;
                
                if (currentMode === 'classic') {
                    points = 1;
                } else {
                    // Modo Probabilidades (Dinámico)
                    const nCartasRestantes = cardsData.length - (matchedPairsCount * 2);
                    
                    if (!isCard1Seen && !isCard2Seen) {
                        points = Math.max(1, nCartasRestantes - 1);
                    } else if (isCard1Seen && isCard2Seen) {
                        points = 1;
                    } else {
                        points = Math.max(1, Math.floor(nCartasRestantes / 2));
                    }
                }

                // Puntaje doble para las imágenes 1, 8, 9 y 13
                if (['kpop-1', 'kpop-8', 'kpop-9', 'kpop-13'].includes(card1.pairId)) {
                    points *= 2;
                }

                // COINCIDENCIA: Sumar puntos y reproducir sonido (si no está silenciado)
                if (!isMuted && globalVolume > 0) {
                    const sfx = new Audio('acierto.mp3');
                    sfx.volume = globalVolume;
                    sfx.play().catch(e => console.log('SFX bloqueado por el navegador', e));
                }

                players[currentPlayerIndex].score += points;
                matchedPairsCount += 1;
                animateScore(points, currentPlayerIndex);

                setTimeout(() => {
                    card1.element.classList.add('matched');
                    card2.element.classList.add('matched');
                    resetTurn();

                    if (matchedPairsCount === totalPairsTarget) {
                        endGame();
                    } else if (totalPairsTarget === 24 && matchedPairsCount === 12 && !hasReshuffled) {
                        hasReshuffled = true;
                        reshuffleBoard();
                    }
                }, 600);
            } else {
                // NO COINCIDENCIA: Añadir a cartas vistas, voltear de nuevo y pasar turno
                seenCards.add(idx1);
                seenCards.add(idx2);

                setTimeout(() => {
                    card1.element.classList.remove('flipped');
                    card2.element.classList.remove('flipped');
                    currentPlayerIndex = (currentPlayerIndex + 1) % players.length;
                    resetTurn();
                }, 1200);
            }
        }

        function resetTurn() {
            flippedCards = [];
            lockBoard = false;
            updateScoreboard();
        }

        function endGame() {
            if (isSoloMode) {
                const playerName = players[0].name;
                const levelKey = document.getElementById('card-count').value;
                showRecordsModal(playerName, levelKey, elapsedSeconds);
                return;
            }

            const modal = document.getElementById('winner-modal');
            const title = document.getElementById('winner-title');
            const detail = document.getElementById('winner-detail');
            const btn = modal.querySelector('.btn');

            // Determinar ganador(es)
            let maxScore = -1;
            let winners = [];

            players.forEach(p => {
                if (p.score > maxScore) {
                    maxScore = p.score;
                    winners = [p.name];
                } else if (p.score === maxScore) {
                    winners.push(p.name);
                }
            });

            if (winners.length === 1) {
                title.textContent = `¡Victoria para ${winners[0]}!`;
                detail.textContent = `Puntuación total: ${maxScore} puntos.`;
                btn.textContent = "Volver al Menú";
                btn.onclick = resetToSetup;
            } else {
                title.textContent = `¡Desempate!`;
                detail.textContent = `Empate entre ${winners.join(' y ')} con ${maxScore} puntos.`;
                if (isOnlineMode) {
                    btn.textContent = "Volver al Lobby";
                    btn.onclick = resetToSetup;
                } else {
                    detail.textContent += ` ¡La partida continúa!`;
                    btn.textContent = "Iniciar Desempate";
                    btn.onclick = () => {
                        modal.style.display = 'none';
                        startTieBreaker();
                    };
                }
            }

            modal.style.display = 'flex';
        }

        function resetToSetup() {
            if (timerInterval) stopTimer();
            stopVoiceChat(); // Detener voz si estaba activa
            document.getElementById('voice-bar').style.display = 'none';
            document.getElementById('winner-modal').style.display = 'none';
            document.getElementById('records-modal').style.display = 'none';
            document.getElementById('game-screen').style.display = 'none';
            
            if (isOnlineMode) {
                // Si es online, regresar al lobby. Si soy el host, reinicio el estado.
                if (isHost) {
                    roomRef.update({
                        status: 'waiting',
                        deck: null,
                        reshuffled: null,
                        clicks: null,
                        signaling: null
                    });
                }
                document.getElementById('online-lobby-screen').style.display = 'block';
                setupLobbyListeners();
            } else {
                document.getElementById('setup-screen').style.display = 'block';
            }
        }

        function startTieBreaker() {
            const cardCount = parseInt(document.getElementById('card-count').value);
            
            // NO limpiamos el array 'players' ni reiniciamos sus scores.
            currentPlayerIndex = 0;
            matchedPairsCount = 0;
            seenCards.clear();
            totalPairsTarget = cardCount / 2;
            hasReshuffled = false;
            cardsData = generateDeck(cardCount);
            
            // Re-renderizamos tablero y puntajes actualizados (que mantienen el score)
            renderScoreboard();
            renderBoard();
        }

        // Inicialización
        loadPreferences();
        renderPlayerInputs();
    </script>
</body>
</html>
